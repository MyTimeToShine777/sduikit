name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck --workspace sduikit
      - name: Package tests (includes "generated schema file is up to date")
        run: npm test
      - name: Example server end-to-end test
        run: npm run test:example
